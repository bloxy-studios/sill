[package]
name = "sill"
description = "A native terminal for modern software development"
publish = false
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sill_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sill-core = { path = "../crates/sill-core", features = ["serde"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
# OS clipboard for copy-selection (clipboard = OS resource, so the write
# lives here, not in the webview). Text-only: default-features = false
# drops "image-data" (unused), and the opt-in "wayland-data-control"
# feature stays off — it pulls wl-clipboard-rs (GPL-3.0), which the
# license allowlist (deny.toml) rejects. Linux clipboard therefore goes
# through X11 (XWayland covers most Wayland sessions); native Wayland
# clipboard support is a tracked follow-up, not silently linked GPL code.
arboard = { version = "3", default-features = false }
