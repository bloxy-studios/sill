# Release: pushing a v* tag builds all platforms and assembles a DRAFT
# GitHub Release with artifacts + SHA256SUMS.txt. A maintainer verifies and
# publishes manually — CI never publishes (docs/RELEASING.md, ADR-0005).
# Signing/notarization are NOT configured yet (docs/RELEASE_SECURITY.md).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }}${{ matrix.args && ', ' }}${{ matrix.args }})
    permissions:
      contents: write # create draft release + upload assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest # Intel
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: ubuntu-22.04-arm # GitHub-hosted ARM runners: public repos
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Tauri system dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Add macOS Rust targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Sill v__VERSION__"
          releaseBody: >
            Draft release assembled by CI. A maintainer verifies artifacts
            against docs/RELEASING.md before publishing. Artifacts are
            UNSIGNED at this stage of the project — verify checksums via
            SHA256SUMS.txt (see docs/RELEASE_SECURITY.md).
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

  checksums:
    name: attach SHA256SUMS
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download draft assets, compute checksums, upload
        run: |
          set -euo pipefail
          RID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            --jq ".[] | select(.tag_name==\"${TAG}\") | .id" | head -n1)
          if [ -z "${RID}" ]; then
            echo "No release found for tag ${TAG}" >&2; exit 1
          fi
          # Invariant: once any complete checksum manifest exists in the
          # release (canonical SHA256SUMS.txt or temp SHA256SUMS.txt.new),
          # at least one remains present at EVERY point of this job, across
          # any failure or rerun interleaving:
          #   1. heal-first: temp exists w/o canonical -> rename temp into
          #      place BEFORE any fallible work (metadata-only PATCH)
          #   2. redundant temp (canonical also present) -> delete temp only
          #      (canonical stays); needed so step 5's upload can't 422
          #   3. download all artifacts (the fallible bulk work)
          #   4. generate the new manifest locally
          #   5. upload it under the TEMP name (old manifest untouched)
          #   6. delete the stale canonical
          #   7. rename temp -> SHA256SUMS.txt
          # Failure between 6 and 7 leaves the complete new manifest under
          # the temp name; the next rerun's step 1 restores it before doing
          # anything that can fail.
          TEMP_NAME="SHA256SUMS.txt.new"
          mkdir -p assets && cd assets
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RID}/assets" \
            --paginate --jq '.[] | "\(.id)\t\(.name)"' > ../asset-list.tsv
          STALE_MANIFEST_ID=$(awk -F'\t' '$2=="SHA256SUMS.txt"{print $1; exit}' ../asset-list.tsv || true)
          LEFTOVER_TEMP_ID=$(awk -F'\t' -v t="${TEMP_NAME}" '$2==t{print $1; exit}' ../asset-list.tsv || true)
          if [ -n "${LEFTOVER_TEMP_ID}" ] && [ -z "${STALE_MANIFEST_ID}" ]; then
            echo "healing: renaming leftover ${TEMP_NAME} (asset ${LEFTOVER_TEMP_ID}) to SHA256SUMS.txt"
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/assets/${LEFTOVER_TEMP_ID}" \
              -f name="SHA256SUMS.txt" > /dev/null
            STALE_MANIFEST_ID="${LEFTOVER_TEMP_ID}"
          elif [ -n "${LEFTOVER_TEMP_ID}" ]; then
            echo "deleting redundant ${TEMP_NAME} (asset ${LEFTOVER_TEMP_ID}); canonical manifest remains"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${LEFTOVER_TEMP_ID}"
          fi
          while IFS=$'\t' read -r AID NAME; do
            if [ "${NAME}" = "${TEMP_NAME}" ] || [ "${NAME}" = "SHA256SUMS.txt" ]; then
              continue
            fi
            echo "downloading ${NAME}"
            curl -sSfL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -o "${NAME}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${AID}"
          done < ../asset-list.tsv
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          NEW_ID=$(curl -sSf -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: text/plain" \
            --data-binary @SHA256SUMS.txt \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RID}/assets?name=${TEMP_NAME}" \
            | jq -r '.id')
          if [ -z "${NEW_ID}" ] || [ "${NEW_ID}" = "null" ]; then
            echo "temp manifest upload did not return an asset id" >&2; exit 1
          fi
          if [ -n "${STALE_MANIFEST_ID}" ]; then
            echo "deleting stale SHA256SUMS.txt (asset ${STALE_MANIFEST_ID})"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${STALE_MANIFEST_ID}"
          fi
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/assets/${NEW_ID}" \
            -f name="SHA256SUMS.txt" > /dev/null
          echo "SHA256SUMS.txt attached to draft release ${TAG}"
