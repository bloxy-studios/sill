# Dependency security: cargo-deny (advisories, licenses, bans, sources) on
# PRs, pushes to main, and a weekly schedule so new advisories surface even
# when the repo is quiet. Dependency Review flags vulnerable or
# license-incompatible additions on PRs.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 5 * * 1" # weekly, Monday 05:37 UTC

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
          manifest-path: src-tauri/Cargo.toml

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
