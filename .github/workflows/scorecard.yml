# OpenSSF Scorecard: measures this repository's security practices and
# publishes results (public repos). Findings feed docs/OPENSSF.md — the score
# is a diagnostic, not a trophy.
name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "19 6 * * 2" # weekly, Tuesday 06:19 UTC

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-22.04
    permissions:
      security-events: write # (reserved for future SARIF upload to code scanning)
      id-token: write # required by publish_results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30
